name: 🎙️ কণ্ঠলিপি — Build & Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  JAVA_VERSION: '17'
  ANDROID_API: '35'
  APP_NAME: 'কণ্ঠলিপি'

jobs:

  validate:
    name: ✅ কোড যাচাই
    runs-on: ubuntu-latest
    steps:
      - name: 📥 কোড ডাউনলোড
        uses: actions/checkout@v4
      - name: ☕ Java সেটআপ
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - name: 📦 Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: 🔑 Gradle পারমিশন
        run: chmod +x gradlew
      - name: 🔍 Lint চেক
        run: ./gradlew lintDebug --no-daemon
      - name: 🧪 Unit Test
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: 📊 Lint রিপোর্ট আপলোড
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

  build-debug:
    name: 🔨 Debug APK তৈরি
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: 📥 কোড ডাউনলোড
        uses: actions/checkout@v4
      - name: ☕ Java সেটআপ
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - name: 📦 Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: 🔑 Gradle পারমিশন
        run: chmod +x gradlew
      - name: 🔧 .env ফাইল তৈরি
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
      - name: 🏗️ Debug APK Build
        run: ./gradlew assembleDebug --no-daemon
      - name: 📋 APK তথ্য
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          APK_SIZE=$(du -sh "$APK_PATH" | cut -f1)
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
      - name: 📤 Debug APK আপলোড
        uses: actions/upload-artifact@v4
        with:
          name: kanthalip-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: 💬 Build সারাংশ
        run: |
          echo "## 🎙️ কণ্ঠলিপি Debug Build" >> $GITHUB_
