name: 🎙️ কণ্ঠলিপি — Build & Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'

jobs:

  validate:
    name: ✅ কোড যাচাই
    runs-on: ubuntu-latest
    steps:
      - name: 📥 কোড ডাউনলোড
        uses: actions/checkout@v4
      - name: ☕ Java সেটআপ
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - name: 📦 Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: 🔧 Gradle Wrapper তৈরি
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'
      - name: 🔑 gradlew পারমিশন
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            gradle wrapper --gradle-version 8.11.1
            chmod +x gradlew
          fi
      - name: 🔧 .env ফাইল তৈরি
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
      - name: 🔍 Lint চেক
        run: ./gradlew lintDebug --no-daemon --stacktrace
      - name: 🧪 Unit Test
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: 📊 Lint রিপোর্ট আপলোড
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

  build-debug:
    name: 🔨 Debug APK তৈরি
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: 📥 কোড ডাউনলোড
        uses: actions/checkout@v4
      - name: ☕ Java সেটআপ
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - name: 📦 Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: 🔧 Gradle Wrapper তৈরি
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'
      - name: 🔑 gradlew পারমিশন
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            gradle wrapper --gradle-version 8.11.1
            chmod +x gradlew
          fi
      - name: 🔧 .env ফাইল তৈরি
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
      - name: 🏗️ Debug APK Build
        run: ./gradlew assembleDebug --no-daemon
      - name: 📋 APK তথ্য
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          APK_SIZE=$(du -sh "$APK_PATH" | cut -f1)
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
      - name: 📤 Debug APK আপলোড
        uses: actions/upload-artifact@v4
        with:
          name: kanthalip-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: 💬 Build সারাংশ
        run: |
          echo "## 🎙️ কণ্ঠলিপি Debug Build" >> $GITHUB_STEP_SUMMARY
          echo "| তথ্য | মান |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| APK সাইজ | $APK_SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| Build নম্বর | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY

  build-release:
    name: 🚀 Release APK তৈরি
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: 📥 কোড ডাউনলোড
        uses: actions/checkout@v4
      - name: ☕ Java সেটআপ
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - name: 📦 Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: 🔧 Gradle Wrapper তৈরি
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'
      - name: 🔑 gradlew পারমিশন
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            gradle wrapper --gradle-version 8.11.1
            chmod +x gradlew
          fi
      - name: 🔧 .env ফাইল তৈরি
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
      - name: 🔐 Keystore ডিকোড
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          else
            echo "⚠️ Keystore নেই"
          fi
      - name: 🏗️ Release APK Build
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: ./gradlew assembleRelease --no-daemon
      - name: 📋 APK তথ্য
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          APK_SIZE=$(du -sh "$APK_PATH" | cut -f1)
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
          VERSION=$(grep 'versionName' app/build.gradle.kts | grep -oP '"\K[^"]+')
          echo "TAG=v${VERSION}-build${{ github.run_number }}" >> $GITHUB_ENV
      - name: 📤 Release APK আপলোড
        uses: actions/upload-artifact@v4
        with:
          name: kanthalip-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
      - name: 🎉 GitHub Release তৈরি
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "🎙️ কণ্ঠলিপি ${{ env.TAG }}"
          body: |
            ## 🎙️ কণ্ঠলিপি — নতুন রিলিজ
            - ✍️ লেখা থেকে ভয়েস
            - 📷 ছবি থেকে OCR
            - 🔊 বাংলা TTS সাপোর্ট
            **Build:** #${{ github.run_number }} | **APK:** ${{ env.APK_SIZE }}
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
